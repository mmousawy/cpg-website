name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag-and-deploy:
    name: Tag release and deploy production
    runs-on: ubuntu-latest
    concurrency:
      group: vps-docker-build
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Create GitHub release when version is new
        id: release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping release create."
            echo "release_created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/extract-changelog-section.mjs "$VERSION" > release-notes.md
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
          echo "release_created=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Coolify production deploy
        env:
          COOLIFY_PRODUCTION_WEBHOOK_URL: ${{ secrets.COOLIFY_PRODUCTION_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${COOLIFY_PRODUCTION_WEBHOOK_URL:-}" ]; then
            echo "::error::COOLIFY_PRODUCTION_WEBHOOK_URL is not set. Copy Deploy Webhook from Coolify → production app → Configuration → Webhooks."
            exit 1
          fi

          if [ -z "${COOLIFY_TOKEN:-}" ]; then
            echo "::error::COOLIFY_TOKEN is not set. Create a Coolify API token with the deploy permission (Keys & Tokens → API Tokens) and save it as this GitHub secret."
            exit 1
          fi

          echo "Triggering Coolify production deploy..."
          body=$(mktemp)
          status=$(curl -sS -o "$body" -w "%{http_code}" -X GET "$COOLIFY_PRODUCTION_WEBHOOK_URL" \
            -A "CPG-CI/1.0" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Accept: application/json")

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Coolify deploy webhook returned HTTP $status"
            head -c 500 "$body" || true
            echo
            rm -f "$body"
            exit 1
          fi

          rm -f "$body"
          echo "Coolify deploy triggered."
