name: Release Please

on:
  push:
    branches:
      - main

concurrency:
  group: vps-docker-build
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy-production:
    name: Deploy production
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify production deploy
        env:
          COOLIFY_PRODUCTION_WEBHOOK_URL: ${{ secrets.COOLIFY_PRODUCTION_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [ -z "${COOLIFY_PRODUCTION_WEBHOOK_URL:-}" ]; then
            echo "::error::COOLIFY_PRODUCTION_WEBHOOK_URL is not set. Copy the webhook URL from Coolify → production app → Webhooks."
            exit 1
          fi

          echo "Triggering Coolify production deploy..."
          curl -fsS -X GET "$COOLIFY_PRODUCTION_WEBHOOK_URL"
          echo "Coolify deploy triggered."
