name: Release Please

on:
  push:
    branches:
      - staging
      - main

permissions:
  contents: write
  pull-requests: write

env:
  RELEASE_BRANCH: release-please--branches--main

jobs:
  promote-pr:
    name: Update release PR into main
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reset promote branch to staging
        run: |
          set -euo pipefail
          git fetch origin staging main --tags
          git checkout -B "$RELEASE_BRANCH" "origin/staging"

      - name: Apply release-please version files
        id: prepare
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: node scripts/prepare-release-branch.mjs

      - name: Commit version bump on promote branch
        if: steps.prepare.outputs.has_release == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md .release-please-manifest.json
          if git diff --staged --quiet; then
            echo "Version files already match release-please output; promoting staging without a version commit."
          else
            git commit -m "chore(main): release ${{ steps.prepare.outputs.version }}"
          fi

      - name: Push promote branch
        if: steps.prepare.outputs.has_release == 'true'
        run: git push --force-with-lease origin "$RELEASE_BRANCH"

      - name: Close legacy component-only release PRs
        if: steps.prepare.outputs.has_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          for head in "release-please--branches--main--components--cpg-website"; do
            nums=$(gh pr list --base main --head "${GITHUB_REPOSITORY_OWNER}:${head}" --state open --json number --jq '.[].number' || true)
            for n in $nums; do
              echo "Closing legacy PR #$n ($head)"
              gh pr close "$n" --comment "Superseded by the staging promote PR (${RELEASE_BRANCH} → main)."
            done
          done

      - name: Upsert single promote PR
        if: steps.prepare.outputs.has_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          TITLE=$(cat .release-pr-title.txt)
          # Same-repo PRs are listed by branch name. owner:branch returns nothing, and create then fails because the PR already exists.
          EXISTING=$(gh pr list --base main --head "$RELEASE_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            if ! gh pr create \
              --base main \
              --head "$RELEASE_BRANCH" \
              --title "$TITLE" \
              --body-file .release-pr-body.md; then
              EXISTING=$(gh pr list --base main --head "$RELEASE_BRANCH" --state open --json number --jq '.[0].number // empty')
              if [ -z "$EXISTING" ]; then
                exit 1
              fi
            fi
          fi
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body-file .release-pr-body.md
            echo "Updated existing promote PR #$EXISTING"
          fi

  tag-and-deploy:
    name: Tag release and deploy production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: vps-docker-build
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Create GitHub release when version is new
        id: release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping release create."
            echo "release_created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/extract-changelog-section.mjs "$VERSION" > release-notes.md
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
          echo "release_created=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Coolify production deploy
        if: steps.release.outputs.release_created == 'true'
        env:
          COOLIFY_PRODUCTION_WEBHOOK_URL: ${{ secrets.COOLIFY_PRODUCTION_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [ -z "${COOLIFY_PRODUCTION_WEBHOOK_URL:-}" ]; then
            echo "::error::COOLIFY_PRODUCTION_WEBHOOK_URL is not set. Copy the webhook URL from Coolify → production app → Webhooks."
            exit 1
          fi

          echo "Triggering Coolify production deploy..."
          curl -fsS -X GET "$COOLIFY_PRODUCTION_WEBHOOK_URL"
          echo "Coolify deploy triggered."
