# Nginx vhost for staging Next.js on Coolify (HTTP — certbot adds HTTPS).
# Staging app should publish 127.0.0.1:2000:3000 (production uses :3000).
#
# Requires /etc/nginx/conf.d/connection-upgrade-map.conf (see nginx-connection-upgrade-map.conf).
# Live VPS (keeps certbot SSL blocks): sudo bash infra/coolify/fix-nginx-proxy-headers.sh
#
# Fresh install:
#   sudo cp infra/coolify/nginx-connection-upgrade-map.conf /etc/nginx/conf.d/connection-upgrade-map.conf
#   sudo cp infra/coolify/nginx-staging.conf /etc/nginx/sites-available/staging.creativephotography.group
#   sudo ln -sf /etc/nginx/sites-available/staging.creativephotography.group /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d staging.creativephotography.group

server {
    listen 80;
    listen [::]:80;
    server_name staging.creativephotography.group;

    client_max_body_size 50m;
    large_client_header_buffers 4 16k;

    location / {
        proxy_pass http://127.0.0.1:2000;
        proxy_http_version 1.1;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
