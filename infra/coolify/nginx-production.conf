# Nginx vhosts for production Next.js on Coolify (HTTP — certbot adds HTTPS).
# Production app should publish 127.0.0.1:3000:3000 (staging uses host :2000).
# See PORTS.md for the full port convention.
#
# Install:
#   sudo cp infra/coolify/nginx-production.conf /etc/nginx/sites-available/creativephotography.group
#   sudo ln -sf /etc/nginx/sites-available/creativephotography.group /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d creativephotography.group -d www.creativephotography.group

server {
    listen 80;
    listen [::]:80;
    server_name creativephotography.group www.creativephotography.group;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
