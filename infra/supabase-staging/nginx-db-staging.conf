# Nginx vhost for staging Supabase Kong (HTTP — certbot adds HTTPS).
# Install: sudo cp this file to /etc/nginx/sites-available/db-staging.creativephotography.group

server {
    listen 80;
    listen [::]:80;
    server_name db-staging.creativephotography.group;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
