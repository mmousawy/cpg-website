# Nginx vhost for staging Supabase — same pattern as production db.creativephotography.group.
# All traffic → Kong on 127.0.0.1:8002 (Kong routes / to Studio, /auth|/rest|… to services).
#
# Install:
#   sudo cp infra/supabase-staging/nginx-db-staging.conf \
#     /etc/nginx/sites-available/db-staging.creativephotography.group
#   sudo ln -sf /etc/nginx/sites-available/db-staging.creativephotography.group \
#     /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d db-staging.creativephotography.group

server {
    listen 80;
    listen [::]:80;
    server_name db-staging.creativephotography.group;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;
    }
}
