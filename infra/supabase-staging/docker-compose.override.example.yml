# /data/supabase-staging/docker-compose.override.yml
#
# REQUIRED on the same VPS as production (/home/ubuntu/supabase-project).
# Renames all container_name values; Kong :8002, Postgres :5433.
# Service key for pooler is supavisor (prod container_name: supabase-pooler).
# db-config and deno-cache need no override.
#
#   cp /home/ubuntu/cpg-website/infra/supabase-staging/docker-compose.override.example.yml \
#     /data/supabase-staging/docker-compose.override.yml

services:
  studio:
    container_name: supabase-staging-studio

  kong:
    container_name: supabase-staging-kong
    # !override replaces base compose ports (otherwise Kong also binds :8000 → conflict with prod)
    ports: !override
      - "127.0.0.1:8002:8000"
      - "127.0.0.1:8444:8443"

  auth:
    container_name: supabase-staging-auth
    # Stock compose does not pass these into the container. .env alone is not enough.
    # See infra/supabase-oauth.md. Staging callback:
    # https://db-staging.creativephotography.group/auth/v1/callback
    environment:
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOTRUE_EXTERNAL_GOOGLE_ENABLED}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOTRUE_EXTERNAL_GOOGLE_SECRET}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI}
      GOTRUE_EXTERNAL_DISCORD_ENABLED: ${GOTRUE_EXTERNAL_DISCORD_ENABLED}
      GOTRUE_EXTERNAL_DISCORD_CLIENT_ID: ${GOTRUE_EXTERNAL_DISCORD_CLIENT_ID}
      GOTRUE_EXTERNAL_DISCORD_SECRET: ${GOTRUE_EXTERNAL_DISCORD_SECRET}
      GOTRUE_EXTERNAL_DISCORD_REDIRECT_URI: ${GOTRUE_EXTERNAL_DISCORD_REDIRECT_URI}

  rest:
    container_name: supabase-staging-rest

  realtime:
    container_name: supabase-staging-realtime

  storage:
    container_name: supabase-staging-storage

  imgproxy:
    container_name: supabase-staging-imgproxy
    # Preserve embedded ICC (Adobe RGB, Display P3, etc.) on /render/image WebP output.
    # Default imgproxy strips profiles → sRGB thumbs look dull vs unoptimized originals.
    environment:
      IMGPROXY_STRIP_COLOR_PROFILE: "false"

  meta:
    container_name: supabase-staging-meta

  functions:
    container_name: supabase-staging-edge-functions

  analytics:
    container_name: supabase-staging-analytics

  db:
    container_name: supabase-staging-db
    ports: !override
      - "127.0.0.1:5433:5432"

  vector:
    container_name: supabase-staging-vector

  supavisor:
    container_name: supabase-staging-pooler
    # Base compose publishes :5432 on the host (prod). Staging uses direct db on :5433 only.
    ports: !override []
