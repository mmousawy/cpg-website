# Nginx vhost for production Supabase API (Kong on 127.0.0.1:8000).
#
# On the VPS the live file is often /etc/nginx/sites-available/supabase (not db.creativephotography.group):
#   sudo grep -r 'server_name.*db.creativephotography.group' /etc/nginx
#   sudo nginx -T 2>/dev/null | grep -B2 -A40 'db.creativephotography.group'
#
# New install:
#   sudo cp infra/nginx-db-production.conf /etc/nginx/sites-available/db.creativephotography.group
#   sudo ln -sf /etc/nginx/sites-available/db.creativephotography.group /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d db.creativephotography.group
#   sudo bash infra/coolify/fix-nginx-proxy-headers.sh
#
# Existing install: add proxy_buffer_* to the location / that proxy_passes to 127.0.0.1:8000.

server {
    listen 80;
    listen [::]:80;
    server_name db.creativephotography.group;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;
    }
}
