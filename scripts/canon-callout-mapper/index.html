<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Canon callout mapper</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.4;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      background: #0f0f10;
      color: #e8e8ea;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem 1.25rem;
      padding: 0.65rem 1rem;
      border-bottom: 1px solid #2a2a2e;
      background: #161618;
    }

    header h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
    }

    #diagram-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    #diagram-tabs a {
      font-size: 0.8rem;
      padding: 0.25rem 0.55rem;
      border-radius: 999px;
      border: 1px solid #3a3a42;
      color: #c8c8d0;
      text-decoration: none;
    }

    #diagram-tabs a:hover {
      background: #2a2a30;
    }

    #diagram-tabs a.active {
      border-color: #2d6a4f;
      background: #1b4332;
      color: #e8ffe8;
    }

    .status {
      flex: 1;
      min-width: 12rem;
      color: #a8a8b0;
    }

    .status strong {
      color: #f5f5f7;
    }

    button {
      font: inherit;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid #3a3a42;
      background: #242428;
      color: inherit;
      padding: 0.35rem 0.75rem;
    }

    button:hover {
      background: #2e2e34;
    }

    button.primary {
      border-color: #2d6a4f;
      background: #1b4332;
    }

    button.primary:hover {
      background: #245c44;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 22rem;
      min-height: 0;
      overflow: hidden;
    }

    .diagram {
      overflow: hidden;
      padding: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 0;
    }

    .diagram svg {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      --learn-diagram-surface: none;
      --learn-diagram-ink: #e0e0e4;
      --learn-diagram-knockout: #0f0f10;
      --primary: #3d9970;
    }

    .diagram svg .learn-canon-callout-dot {
      cursor: pointer;
      pointer-events: all;
    }

    .diagram svg .learn-canon-callout-dot.mapper-has-ref {
      fill: #3d9970;
    }

    .diagram svg .learn-canon-callout-dot.mapper-edited {
      fill: #f4c430;
      stroke: #c9a227;
      stroke-width: 2px;
    }

    .diagram svg .learn-canon-callout-dot.mapper-dup-ref {
      fill: #e76f51;
      stroke: #c44d34;
    }

    .diagram svg .learn-canon-callout-dot.mapper-selected {
      stroke: #ffb347;
      stroke-width: 3px;
      fill: #ffb347;
    }

    aside {
      border-left: 1px solid #2a2a2e;
      background: #161618;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    aside h2 {
      margin: 0;
      padding: 0.75rem 1rem;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #8b8b94;
      border-bottom: 1px solid #2a2a2e;
      flex-shrink: 0;
      background: #161618;
    }

    .aside-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .part-list {
      list-style: none;
      margin: 0;
      padding: 0.35rem 0;
    }

    .part-list li button {
      width: 100%;
      text-align: left;
      border: none;
      border-radius: 0;
      background: transparent;
      padding: 0.45rem 1rem;
      display: grid;
      grid-template-columns: 2.25rem minmax(0, 1fr) auto;
      gap: 0.5rem;
      align-items: start;
      line-height: 1.35;
    }

    .part-list li button .ref {
      padding-top: 1px;
    }

    .part-list li button:hover {
      background: #222228;
    }

    .part-list li button.mapper-target {
      outline: 2px solid #3d9970;
      outline-offset: -2px;
      background: #1a2e24;
    }

    .part-list li button.mapper-missing .ref {
      color: #e76f51;
    }

    .part-list li button.mapper-ok .ref {
      color: #52b788;
    }

    .ref {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: #9a9aa3;
    }

    .label {
      color: #e0e0e4;
    }

    .badge {
      font-size: 0.72rem;
      color: #8b8b94;
      white-space: nowrap;
    }

    .note {
      grid-column: 2 / -1;
      font-size: 0.75rem;
      color: #6e6e76;
    }

    .toast {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      padding: 0.5rem 0.85rem;
      border-radius: 8px;
      background: #1b4332;
      border: 1px solid #2d6a4f;
      opacity: 0;
      transform: translateY(0.5rem);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast.error {
      background: #4a1510;
      border-color: #9b2226;
    }
  </style>
</head>

<body>
  <header>
    <h1>Callout mapper</h1>
    <nav id="diagram-tabs" aria-label="Diagram view"></nav>
    <p class="status" id="status">
      Click a <strong>dot</strong> on the diagram, then a <strong>part number</strong> on the
      right.
    </p>
    <button type="button" id="btn-clear" disabled>Clear dot ref</button>
    <button type="button" class="primary" id="btn-save" disabled>Save SVG</button>
  </header>
  <main>
    <div class="diagram" id="diagram"></div>
    <aside>
      <h2>Part names (¾ view)</h2>
      <div class="aside-scroll">
        <ul class="part-list" id="parts"></ul>
      </div>
    </aside>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="/app.js"></script>
</body>

</html>
